    template: 원문 출처는 본문의 Source에서 확인할 수 있습니다.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Displayed in the footer
  brief: 모든 권리 보유
  verbose: >-
    별도 허락 없이 게시글 전체를 재배포할 수 없습니다. 인용한 원문의 권리는 원저작자에게 있습니다.

meta: Powered by :PLATFORM with :THEME theme

not_found:
  statement: 해당 URL은 존재하지 않습니다.

notification:
  update_found: 새 콘텐츠가 있습니다
  update: 업데이트

theme:
  light: 라이트
  dark: 다크
  system: 시스템

# ----- Posts related labels -----

post:
  written_by: By
  posted: 게시
  updated: 업데이트
  words: 단어
  pageview_measure: 조회
  read_time:
    unit: 분
    prompt: 읽는 시간
  edit: 이 글 편집
  relate_posts: 관련된 글
  share: 공유하기
  button:
    next: 다음 글
    previous: 이전 글
    copy_code:
      succeed: 복사되었습니다!
    share_link:
      title: 링크 복사하기
      succeed: 링크가 복사되었습니다!

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%Y/%m/%d"
    dayjs: "YYYY/MM/DD"

# categories page
categories:
  category_measure: 카테고리
  post_measure: 포스트
