{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}

<link rel="shortcut icon" type="image/x-icon" href="{{ favicon_path }}/j-note-v2.ico">
<link rel="icon" type="image/svg+xml" sizes="any" href="{{ favicon_path }}/j-note-v2.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{ favicon_path }}/j-note-v2-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ favicon_path }}/j-note-v2-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/j-note-v2-180.png">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/j-note-v2.webmanifest">
{% endif %}
